[package]
name = "wasm-crypto-box"
version = "0.1.0"
edition = "2024"
description = "Browser-safe WebAssembly wrapper for ed25519 signing and verification"
license = "MIT"
readme = "README.md"
repository = "https://github.com/<your-username>/wasm-crypto-box"
homepage = "https://github.com/<your-username>/wasm-crypto-box"
documentation = "https://docs.rs/wasm-crypto-box"
keywords = ["wasm", "ed25519", "crypto", "webassembly", "wasm-bindgen"]
categories = ["cryptography"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
ed25519-dalek = "1"
rand_chacha = "0.3"
getrandom = { version = "0.2", features = ["js"] }
